name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        shell: pwsh
        run: .\test.ps1

      - name: Build package
        shell: pwsh
        run: .\build.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Windows前端项目部署工具
          path: |
            dist/Windows前端项目部署工具EXE/**
            dist/Windows前端项目部署工具EXE-v*.zip
